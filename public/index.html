<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safe Haven | Deployment Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #07110f;
      color: #f5faf8;
      font-family: Arial, sans-serif;
      padding: 24px;
    }
    main { max-width: 650px; }
    .label { color: #00d998; letter-spacing: 3px; font-size: 12px; }
    h1 { font-size: clamp(42px, 7vw, 76px); line-height: 1.05; }
    p { color: #aebfba; font-size: 18px; line-height: 1.7; }
    .status { margin-top: 32px; color: #00d998; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <div class="label">SAFE HAVEN · CUSTOMER DEPLOYMENT TEST</div>
    <h1>Your app.<br>Safely hosted.</h1>
    <p>This application is being used to verify Safe Haven's GitHub-to-hosting deployment experience.</p>
    <div class="status">● Redeployment update verified</div>
  </main>
</body>
</html>
